<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIPOVER - Login & Register</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#eef4ff,#f8fbff);
  padding:20px;
}

.box{
  width:100%;
  max-width:410px;
  background:white;
  padding:28px;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:800;
  margin-bottom:5px;
  letter-spacing:1px;
  color:#111827;
}

.logo span{
  color:#1677ff;
}

.tagline{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  margin-bottom:22px;
  border-bottom:1px solid #ddd;
}

.tabs button{
  width:50%;
  padding:13px;
  border:0;
  background:white;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  color:#777;
  border-bottom:3px solid transparent;
}

.tabs button.active{
  color:#1677ff;
  border-bottom-color:#1677ff;
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#222;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:bold;
  color:#444;
}

.input-box{
  position:relative;
}

input{
  width:100%;
  padding:13px 45px 13px 13px;
  border:1px solid #ccc;
  border-radius:9px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#1677ff;
}

.eye{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:20px;
  padding:4px;
}

.submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#1677ff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.submit:hover{
  background:#075fd6;
}

.hidden{
  display:none;
}

.message{
  text-align:center;
  margin-bottom:15px;
  font-size:14px;
  color:#d00;
}

@media(max-width:450px){
  .box{
    padding:22px 18px;
  }

  .logo{
    font-size:31px;
  }
}
</style>
</head>

<body>

<div class="box">

  <!-- SHIPOVER LOGO -->
  <div class="logo">
    SHIP<span>OVER</span>
  </div>

  <div class="tagline">
    Welcome to SHIPOVER
  </div>

  <!-- LOGIN / REGISTER TABS -->
  <div class="tabs">
    <button id="loginTab" class="active">
      Login
    </button>

    <button id="registerTab">
      Register
    </button>
  </div>

  <div id="message" class="message"></div>

  <!-- LOGIN -->
  <form id="loginForm">

    <h2>Login</h2>

    <div class="form-group">
      <label>Phone Number</label>
      <input
        type="tel"
        id="loginPhone"
        placeholder="03XXXXXXXXX"
        required
      >
    </div>

    <div class="form-group">
      <label>Password</label>

      <div class="input-box">
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

        <button
          type="button"
          class="eye"
          onclick="togglePassword('loginPassword',this)"
        >👁️</button>
      </div>
    </div>

    <button type="submit" class="submit">
      Login
    </button>

  </form>


  <!-- REGISTER -->
  <form id="registerForm" class="hidden">

    <h2>Create Account</h2>

    <div class="form-group">
      <label>Full Name</label>

      <input
        type="text"
        id="registerName"
        placeholder="Enter your full name"
        required
      >
    </div>

    <div class="form-group">
      <label>Phone Number</label>

      <input
        type="tel"
        id="registerPhone"
        placeholder="03XXXXXXXXX"
        required
      >
    </div>

    <div class="form-group">
      <label>Password</label>

      <div class="input-box">
        <input
          type="password"
          id="registerPassword"
          placeholder="Create password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="eye"
          onclick="togglePassword('registerPassword',this)"
        >👁️</button>
      </div>
    </div>

    <div class="form-group">
      <label>Confirm Password</label>

      <div class="input-box">
        <input
          type="password"
          id="registerConfirm"
          placeholder="Confirm password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="eye"
          onclick="togglePassword('registerConfirm',this)"
        >👁️</button>
      </div>
    </div>

    <button type="submit" class="submit">
      Create Account
    </button>

  </form>

</div>


<script>

const loginTab =
  document.getElementById("loginTab");

const registerTab =
  document.getElementById("registerTab");

const loginForm =
  document.getElementById("loginForm");

const registerForm =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");


/* SHOW / HIDE PASSWORD */

function togglePassword(id, button){

  const input =
    document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";
    button.textContent = "🙈";

  }else{

    input.type = "password";
    button.textContent = "👁️";

  }
}


/* LOGIN TAB */

loginTab.onclick = function(){

  loginTab.classList.add("active");
  registerTab.classList.remove("active");

  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");

  message.textContent = "";
};


/* REGISTER TAB */

registerTab.onclick = function(){

  registerTab.classList.add("active");
  loginTab.classList.remove("active");

  registerForm.classList.remove("hidden");
  loginForm.classList.add("hidden");

  message.textContent = "";
};


/* REGISTER */

registerForm.onsubmit = function(e){

  e.preventDefault();

  const name =
    document.getElementById("registerName").value.trim();

  const phone =
    document.getElementById("registerPhone").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const confirm =
    document.getElementById("registerConfirm").value;


  if(password !== confirm){

    message.textContent =
      "Passwords do not match.";

    return;
  }


  if(password.length < 6){

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  let users =
    JSON.parse(
      localStorage.getItem("shipover_users")
    ) || [];


  const alreadyExists =
    users.find(user => user.phone === phone);


  if(alreadyExists){

    message.textContent =
      "This phone number is already registered.";

    return;
  }


  users.push({
    name:name,
    phone:phone,
    password:password
  });


  localStorage.setItem(
    "shipover_users",
    JSON.stringify(users)
  );


  message.style.color = "green";
  message.textContent =
    "Account created successfully!";


  registerForm.reset();


  setTimeout(function(){

    loginTab.click();

  },1000);
};


/* LOGIN */

loginForm.onsubmit = function(e){

  e.preventDefault();


  const phone =
    document.getElementById("loginPhone").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  const users =
    JSON.parse(
      localStorage.getItem("shipover_users")
    ) || [];


  const user =
    users.find(function(u){

      return (
        u.phone === phone &&
        u.password === password
      );

    });


  if(!user){

    message.style.color = "red";

    message.textContent =
      "Wrong phone number or password.";

    return;
  }


  /* SAVE LOGIN SESSION */

  localStorage.setItem(
    "shipover_current_user",
    JSON.stringify({
      name:user.name,
      phone:user.phone
    })
  );


  message.style.color = "green";

  message.textContent =
    "Login successful!";


  setTimeout(function(){

    window.location.href = "home.html";

  },700);

};

</script>

</body>
  </html>
