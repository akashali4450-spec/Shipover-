<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipover - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #071a2b, #0b5cff);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 380px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #0b5cff;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: #0b5cff;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #0b5cff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0847c7;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #666;
    }

    .switch span {
      color: #0b5cff;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">SHIPOVER</div>
    <div class="subtitle">Fast & Reliable Delivery</div>

    <!-- LOGIN -->
    <div id="loginBox">

      <h2>Login</h2>

      <input type="email" id="loginEmail" placeholder="Email Address">
      <input type="password" id="loginPassword" placeholder="Password">

      <button onclick="login()">Login</button>

      <div class="switch">
        Don't have an account?
        <span onclick="showRegister()">Register</span>
      </div>

      <div class="message" id="loginMessage"></div>

    </div>


    <!-- REGISTER -->
    <div id="registerBox" class="hidden">

      <h2>Create Account</h2>

      <input type="text" id="name" placeholder="Full Name">
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Create Password">
      <input type="password" id="confirmPassword" placeholder="Confirm Password">

      <button onclick="register()">Register</button>

      <div class="switch">
        Already have an account?
        <span onclick="showLogin()">Login</span>
      </div>

      <div class="message" id="registerMessage"></div>

    </div>

  </div>


<script>

function showRegister() {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("registerBox").classList.remove("hidden");
}

function showLogin() {
  document.getElementById("registerBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

function register() {

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirmPassword").value;

  if (!name || !email || !password || !confirmPassword) {
    document.getElementById("registerMessage").innerText =
      "Please fill all fields.";
    return;
  }

  if (password !== confirmPassword) {
    document.getElementById("registerMessage").innerText =
      "Passwords do not match.";
    return;
  }

  localStorage.setItem("shipoverUser", JSON.stringify({
    name: name,
    email: email,
    password: password
  }));

  document.getElementById("registerMessage").innerText =
    "Registration successful!";

  setTimeout(showLogin, 1000);
}


function login() {

  let email = document.getElementById("loginEmail").value;
  let password = document.getElementById("loginPassword").value;

  let user = JSON.parse(localStorage.getItem("shipoverUser"));

  if (!user) {
    document.getElementById("loginMessage").innerText =
      "No account found. Please register first.";
    return;
  }

  if (email === user.email && password === user.password) {

    document.getElementById("loginMessage").innerText =
      "Login successful! Welcome " + user.name;

  } else {

    document.getElementById("loginMessage").innerText =
      "Invalid email or password.";

  }
}

</script>

</body>
  </html>
