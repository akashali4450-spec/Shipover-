<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIPOVER - Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <div class="auth-container">

    <div class="logo">
      SHIP<span>OVER</span>
    </div>

    <p class="tagline">Welcome to SHIPOVER</p>

    <div class="auth-card">

      <div class="tabs">
        <button type="button" id="loginTab" class="tab active">
          Login
        </button>

        <button type="button" id="registerTab" class="tab">
          Register
        </button>
      </div>

      <div id="message" class="message"></div>

      <!-- LOGIN -->
      <form id="loginForm">

        <div class="form-group">
          <label for="loginPhone">Phone Number</label>
          <input
            type="tel"
            id="loginPhone"
            placeholder="03XXXXXXXXX"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="main-btn">
          Login
        </button>

      </form>

      <!-- REGISTER -->
      <form id="registerForm" class="hidden">

        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input
            type="text"
            id="registerName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPhone">Phone Number</label>
          <input
            type="tel"
            id="registerPhone"
            placeholder="03XXXXXXXXX"
            autocomplete="tel"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="Minimum 6 characters"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerConfirm">Confirm Password</label>
          <input
            type="password"
            id="registerConfirm"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" class="main-btn">
          Create Account
        </button>

      </form>

    </div>

    <p class="copyright">
      © <span id="year"></span> SHIPOVER. All rights reserved.
    </p>

  </div>

  <script src="script.js"></script>
</body>
</html>
